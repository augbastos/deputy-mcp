name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual run, e.g. right after the repository becomes public

# Cancel superseded PR runs, but let main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"  # every job installs exactly what uv.lock pins

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            .github/workflows/ci.yml
      - name: Install pinned uv and reuse the pip cache
        shell: bash
        run: |
          python -m pip install uv==0.13.8
          echo "UV_CACHE_DIR=$(python -m pip cache dir)/uv" >> "$GITHUB_ENV"
      - run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            .github/workflows/ci.yml
      - name: Install pinned uv and reuse the pip cache
        shell: bash
        run: |
          python -m pip install uv==0.13.8
          echo "UV_CACHE_DIR=$(python -m pip cache dir)/uv" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows is a first-class target (keychain backend, paths, line endings):
          # cover the oldest and newest supported Python there too.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            .github/workflows/ci.yml
      - name: Install pinned uv and reuse the pip cache
        shell: bash
        run: |
          python -m pip install uv==0.13.8
          echo "UV_CACHE_DIR=$(python -m pip cache dir)/uv" >> "$GITHUB_ENV"
      - run: uv sync
      - name: pytest (unit, client, server and agent evals; coverage gate on one leg)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv run pytest --cov --cov-report=term-missing
          else
            uv run pytest
          fi

  package:
    name: Package (build, metadata, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            .github/workflows/ci.yml
      - name: Install pinned uv and reuse the pip cache
        shell: bash
        run: |
          python -m pip install uv==0.13.8
          echo "UV_CACHE_DIR=$(python -m pip cache dir)/uv" >> "$GITHUB_ENV"
      - name: Build sdist and wheel
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine==7.0.0 check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/deputy-mcp --help
          /tmp/wheel-check/bin/python -c "import deputy_mcp, deputy_mcp.server.app; print(deputy_mcp.__version__)"
      - name: CycloneDX SBOM of the locked runtime dependencies
        run: uv export --preview-features sbom-export --format cyclonedx1.5 --no-dev --output-file dist/deputy-mcp.cdx.json > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            .github/workflows/ci.yml
      - name: Install pinned uv and reuse the pip cache
        shell: bash
        run: |
          python -m pip install uv==0.13.8
          echo "UV_CACHE_DIR=$(python -m pip cache dir)/uv" >> "$GITHUB_ENV"
      - name: Audit every locked package (runtime and dev) against the PyPA advisory DB
        run: |
          uv export --no-emit-project --format requirements.txt --output-file /tmp/requirements.txt
          uvx pip-audit==2.10.1 --requirement /tmp/requirements.txt --require-hashes --disable-pip --strict

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: docker build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: deputy-mcp:ci
          cache-from: type=gha,scope=deputy-mcp-ci
          cache-to: type=gha,mode=max,scope=deputy-mcp-ci
      - name: The image starts and fails closed without credentials
        run: |
          set +e
          output=$(docker run --rm deputy-mcp:ci 2>&1 </dev/null)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "No Deputy credentials found"
